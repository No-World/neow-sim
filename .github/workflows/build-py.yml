name: build-py

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: neow_sim-linux-x86_64.whl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: neow_sim-windows-x86_64.whl
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: neow_sim-macos-arm64.whl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/py/Cargo.toml
          manylinux: auto

      - name: Test import
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "
          import neow_sim
          print('version:', neow_sim.__version__)
          print('MAX_T:', neow_sim.MAX_T)
          env = neow_sim.GymEnv(seed=42, ascension=0, character='IRONCLAD')
          obs = env.reset()
          print('reset ok, seq_len:', obs.seq_len)
          legal = env.legal_actions
          print('legal actions:', len(legal.flat))
          # step
          a = legal.flat[0]
          obs, r, done, info = env.step(a.action_type, a.entity, a.target)
          print('step ok, done:', done)
          # numpy
          import numpy as np
          print('feats shape:', obs.token_feats_np.shape)
          print('types dtype:', obs.token_types_np.dtype)
          print('ALL OK')
          "

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Collect wheels
        shell: bash
        run: |
          mkdir -p dist
          find dist-all -name "*.whl" -exec cp {} dist/ \;
          ls dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.whl
