[package]
name = "neow-sim"
description = "Python bindings for neow-sim-core (unified gym protocol)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "neow_sim"
crate-type = ["cdylib", "rlib"]

[dependencies]
neow-sim-core = { path = "../core" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
numpy = "0.23"
